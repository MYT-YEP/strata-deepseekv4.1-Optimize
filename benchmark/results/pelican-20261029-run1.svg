<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#c8d8c0"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#a0b0a0" stroke-width="2"/>
  
  <!-- Bicycle - rear wheel -->
  <circle cx="280" cy="480" r="70" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="480" r="10" fill="#333"/>
  <!-- spokes -->
  <line x1="280" y1="410" x2="280" y2="550" stroke="#666" stroke-width="2"/>
  <line x1="210" y1="480" x2="350" y2="480" stroke="#666" stroke-width="2"/>
  <line x1="230" y1="430" x2="330" y2="530" stroke="#666" stroke-width="2"/>
  <line x1="330" y1="430" x2="230" y2="530" stroke="#666" stroke-width="2"/>
  
  <!-- Bicycle - front wheel -->
  <circle cx="520" cy="480" r="70" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="520" cy="480" r="10" fill="#333"/>
  <!-- spokes -->
  <line x1="520" y1="410" x2="520" y2="550" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="480" x2="590" y2="480" stroke="#666" stroke-width="2"/>
  <line x1="470" y1="430" x2="570" y2="530" stroke="#666" stroke-width="2"/>
  <line x1="570" y1="430" x2="470" y2="530" stroke="#666" stroke-width="2"/>
  
  <!-- Bicycle frame -->
  <line x1="280" y1="480" x2="400" y2="380" stroke="#e74c3c" stroke-width="6"/>
  <line x1="400" y1="380" x2="520" y2="480" stroke="#e74c3c" stroke-width="6"/>
  <line x1="280" y1="480" x2="400" y2="380" stroke="#e74c3c" stroke-width="6"/>
  <line x1="400" y1="380" x2="400" y2="480" stroke="#e74c3c" stroke-width="6"/>
  <line x1="400" y1="480" x2="280" y2="480" stroke="#e74c3c" stroke-width="6"/>
  <line x1="400" y1="380" x2="520" y2="480" stroke="#e74c3c" stroke-width="6"/>
  
  <!-- Seat post -->
  <line x1="400" y1="380" x2="390" y2="340" stroke="#333" stroke-width="5"/>
  <!-- Seat -->
  <ellipse cx="385" cy="335" rx="30" ry="10" fill="#333"/>
  
  <!-- Handlebars -->
  <line x1="520" y1="480" x2="540" y2="360" stroke="#333" stroke-width="5"/>
  <line x1="540" y1="360" x2="560" y2="350" stroke="#333" stroke-width="5"/>
  <line x1="540" y1="360" x2="520" y2="350" stroke="#333" stroke-width="5"/>
  
  <!-- Pedals -->
  <line x1="400" y1="480" x2="400" y2="500" stroke="#333" stroke-width="4"/>
  <rect x="390" y="495" width="20" height="8" rx="3" fill="#333"/>
  
  <!-- Pelican body -->
  <ellipse cx="380" cy="300" rx="70" ry="55" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Pelican wing -->
  <path d="M340 280 Q300 250 310 310 Q320 330 360 320" fill="#e8e8e8" stroke="#ccc" stroke-width="2"/>
  
  <!-- Pelican neck -->
  <path d="M420 280 Q450 240 460 200 Q465 180 455 170" fill="none" stroke="#f5f5f5" stroke-width="25" stroke-linecap="round"/>
  <path d="M420 280 Q450 240 460 200 Q465 180 455 170" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pelican head -->
  <ellipse cx="455" cy="165" rx="30" ry="25" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Pelican eye -->
  <circle cx="465" cy="158" r="5" fill="#333"/>
  <circle cx="467" cy="156" r="2" fill="#fff"/>
  
  <!-- Pelican beak -->
  <path d="M480 165 Q520 160 530 175 Q520 185 480 180 Z" fill="#f4a261" stroke="#e08c3a" stroke-width="2"/>
  <path d="M480 175 Q510 178 520 180" fill="none" stroke="#e08c3a" stroke-width="1.5"/>
  
  <!-- Pelican pouch -->
  <path d="M480 180 Q500 195 520 180" fill="#f4a261" stroke="#e08c3a" stroke-width="1.5"/>
  
  <!-- Pelican legs -->
  <line x1="370" y1="345" x2="360" y2="400" stroke="#f4a261" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="345" x2="400" y2="400" stroke="#f4a261" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pelican feet on pedals -->
  <path d="M350 400 Q360 410 370 400" fill="none" stroke="#f4a261" stroke-width="4" stroke-linecap="round"/>
  <path d="M390 400 Q400 410 410 400" fill="none" stroke="#f4a261" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pelican tail -->
  <path d="M320 310 Q290 290 300 270" fill="none" stroke="#ddd" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Motion lines -->
  <line x1="150" y1="450" x2="180" y2="450" stroke="#aaa" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="140" y1="470" x2="170" y2="470" stroke="#aaa" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="160" y1="490" x2="190" y2="490" stroke="#aaa" stroke-width="2" stroke-dasharray="8,4"/>
</svg>